name: 'SSH Execute on VPS'
description: 'Execute command on VPS via SSH with anti-TOFU fingerprint pinning. Cycle 29 ADR-010 sous-action 2.'

inputs:
  ssh_host:
    description: 'VPS hostname (e.g. stg.example.com)'
    required: true
  ssh_user:
    description: 'SSH user (e.g. deploy / ops)'
    required: true
  ssh_fingerprint:
    description: 'SSH host fingerprint (anti-TOFU pinning)'
    required: true
  ssh_key:
    description: 'SSH private key (typically from INFRA_SSH_KEY secret)'
    required: true
  command:
    description: 'Bash command to execute on VPS (direct command, NO heredoc nested per ADR-004 R2-F8)'
    required: true
  timeout_minutes:
    description: 'SSH connection timeout in minutes (default 10)'
    required: false
    default: '10'
  server_alive_interval:
    description: 'SSH ServerAliveInterval in seconds (anti-stall long ops)'
    required: false
    default: '30'

runs:
  using: 'composite'
  steps:
    - name: Setup SSH agent + known_hosts (anti-TOFU pinned)
      shell: bash
      env:
        INFRA_SSH_KEY: ${{ inputs.ssh_key }}
        SSH_FINGERPRINT: ${{ inputs.ssh_fingerprint }}
      run: |
        set -euo pipefail
        echo "::add-mask::${INFRA_SSH_KEY}"
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "${INFRA_SSH_KEY}" > ~/.ssh/composite_ops_key
        chmod 600 ~/.ssh/composite_ops_key
        printf '%s\n' "${SSH_FINGERPRINT}" >> ~/.ssh/known_hosts

    - name: SSH execute command
      shell: bash
      env:
        SSH_USER: ${{ inputs.ssh_user }}
        SSH_HOST: ${{ inputs.ssh_host }}
        REMOTE_COMMAND: ${{ inputs.command }}
        SERVER_ALIVE: ${{ inputs.server_alive_interval }}
        TIMEOUT_MIN: ${{ inputs.timeout_minutes }}
      run: |
        set -euo pipefail

        # Sub-action 2 cycle 29 Wave 1 closure 4.5 (Finding B Option B trust boundary) :
        # Anti-injection regex command input (anti shell-injection composite action input).
        # Anti-patterns bannis : $() command substitution + backticks + eval/declare + source /dev/stdin.
        # Trust boundary : ce composite action interne workflows deploy-app.yml/rollback-app.yml — NE PAS
        # passer user-controlled inputs direct comme command. Hardcoder OR utiliser env vars typed A2K_*.
        # Note empirique : backtick utilisé via character class [\`] (literal escape compatible bash heredoc).
        #
        # R1-W1-05 LOW Wave 2 §2.5 — KNOWN tradeoff regex false-positive eval :
        # \beval\b catches legitimate words containing "eval" (e.g. "evaluation", "eval-flag",
        # "# eval comment"). Acceptable defense-in-depth — apps consommatrices MUST avoid these
        # patterns in COMMAND inputs (refactor if needed). Cf. DEPLOY-APP-INVOKER-GUIDE.md
        # § Trust Boundary Composite Actions + SECURITY-DEFENSE-IN-DEPTH-SETUP.md.
        if printf '%s' "${REMOTE_COMMAND}" | grep -qE '(\$\(|[`]|\beval\b|\bdeclare\b|source[[:space:]]+/dev/std)'; then
          echo "::error::COMMAND contains suspicious patterns (eval/declare/source /dev/stdin/backtick/command-sub)"
          echo "::error::Trust boundary breach — cf. DEPLOY-APP-INVOKER-GUIDE.md § Trust Boundary Composite Actions"
          exit 1
        fi

        # Direct SSH command exec (push-and-forget cycle 12 — pas heredoc nested cohérent ADR-004 R2-F8)
        # ServerAliveInterval anti-stall long ops (deploy.sh peut prendre minutes)
        timeout "${TIMEOUT_MIN}m" \
          ssh -i ~/.ssh/composite_ops_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ServerAliveInterval="${SERVER_ALIVE}" \
              "${SSH_USER}@${SSH_HOST}" \
              "${REMOTE_COMMAND}"
        echo "✓ SSH execute OK"

    - name: Cleanup SSH artifacts
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        rm -f ~/.ssh/composite_ops_key
